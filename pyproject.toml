[project]
name = "mixnavuts"
version = "0.1.0"
description = "MIXNAVUTS Engine — predictive multi-route navigation (prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
korea = ["pyshp>=2.3"]

[project.scripts]
mixnavuts = "mixnavuts.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mixnavuts", "mixnavuts.korea"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["B905"]
