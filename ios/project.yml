# Xcode project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen)
#   brew install xcodegen && cd ios && xcodegen generate && open Mixnavuts.xcodeproj
name: Mixnavuts
options:
  bundleIdPrefix: com.mixnavuts
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MixnavutsKit:
    path: MixnavutsKit
  # 네이버 지도 SDK. 빼려면 이 항목과 아래 dependency를 지우면 된다 (그러면 MapKit만 쓴다).
  NMapsMap:
    url: https://github.com/navermaps/SPM-NMapsMap
    from: "3.18.0"
targets:
  Mixnavuts:
    type: application
    platform: iOS
    sources:
      - Mixnavuts
    configFiles:
      Debug: Config/Mixnavuts.xcconfig
      Release: Config/Mixnavuts.xcconfig
    dependencies:
      - package: MixnavutsKit
      - package: NMapsMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mixnavuts.app
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: Mixnavuts/Mixnavuts.entitlements
      properties:
        # CarPlay 내비게이션 앱 권한. Apple에 CarPlay 앱 권한을 신청해 프로비저닝 프로필에 넣어야 실기기에서 동작한다.
        com.apple.developer.carplay-maps: true
    info:
      path: Mixnavuts/Info.plist
      properties:
        CFBundleDisplayName: MIXNAVUTS
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: 주행 안내를 위해 현재 위치를 사용합니다.
        NSLocationAlwaysAndWhenInUseUsageDescription: 화면이 꺼져도 주행 안내를 이어가기 위해 위치를 사용합니다.
        UIBackgroundModes: [location]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        MixnavutsAPIBaseURL: $(MIXNAVUTS_API_URL)
        NaverMapClientID: $(NAVER_MAP_CLIENT_ID)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
